name: Apply P04 WorldOps Overlay

on:
  push:
    branches:
      - feature/dol-worldops
    paths:
      - "dol-worldops/.integration/p04_overlay.zip"
      - "dol-worldops/.integration/P04_OVERLAY_SHA256.txt"
      - ".github/workflows/apply-p04-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-p04-worldops-overlay
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/dol-worldops
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dol-worldops/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dol-worldops/pyproject.toml

      - name: Verify and extract P04 overlay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          root = Path.cwd().resolve()
          archive = root / "dol-worldops/.integration/p04_overlay.zip"
          expected = "42e629245b4f597f1de3112a268f79dee48a3721e9e652ec2e4f846bc7b2da6f"
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"P04 overlay SHA-256 mismatch: {actual}")

          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  relative = Path(member.filename)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe archive path: {member.filename}")
                  target = (root / relative).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f"Archive path escaped repository: {member.filename}")
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(source.read(member))
          PY

      - name: Install locked dependencies
        shell: bash
        run: |
          cd dol-worldops
          npm ci --ignore-scripts
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run complete P01-P04 regression suite
        shell: bash
        run: |
          cd dol-worldops
          npm test
          pytest -q
          python -m compileall -q server tests
          find runtime tests demo -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Verify safety boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("dol-worldops")
          prohibited_extensions = {".twee", ".tw", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".mp3", ".ogg", ".wav", ".mp4", ".webm"}
          bad = [str(path) for path in root.rglob("*") if path.is_file() and path.suffix.lower() in prohibited_extensions]
          if bad:
              raise SystemExit("External DoL narrative/media files detected: " + ", ".join(bad))

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".js", ".mjs", ".py", ".sql", ".json", ".md", ".yml", ".yaml", ".toml"}:
                  continue
              text = path.read_text(encoding="utf-8")
              if "\x00" in text or "\ufffd" in text:
                  raise SystemExit(f"Invalid text encoding marker: {path}")
          PY

      - name: Remove one-time integration artifacts
        shell: bash
        run: |
          rm -f dol-worldops/.integration/p04_overlay.zip
          rm -f dol-worldops/.integration/P04_OVERLAY_SHA256.txt
          rmdir dol-worldops/.integration 2>/dev/null || true
          rm -f .github/workflows/apply-p04-overlay.yml

      - name: Commit verified P04 integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No P04 changes to commit"
            exit 0
          fi
          git commit -m "feat(worldops): integrate P04 recovery lifecycle"
          git push origin HEAD:feature/dol-worldops
