name: DoL WorldOps Runtime

on:
  push:
    branches:
      - feature/dol-worldops
    paths:
      - "dol-worldops/**"
      - ".github/workflows/dol-worldops-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dol-worldops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dol-worldops
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dol-worldops/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dol-worldops/pyproject.toml
      - name: Install locked Node metadata
        run: npm ci --ignore-scripts
      - name: Install Python test environment
        run: python -m pip install -e ".[test]"
      - name: JavaScript contracts
        run: npm test
      - name: Python contracts
        run: python -m pytest
      - name: Python compile check
        run: python -m compileall -q server
      - name: JavaScript syntax checks
        run: find runtime tests demo -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
