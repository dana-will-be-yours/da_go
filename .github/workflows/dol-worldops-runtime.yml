name: DoL WorldOps Runtime

on:
  push:
    branches:
      - feature/dol-worldops
    paths:
      - "dol-worldops/**"
      - ".github/workflows/dol-worldops-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dol-worldops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dol-worldops
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dol-worldops/package-lock.json
      - name: Install locked package metadata
        run: npm ci --ignore-scripts
      - name: Runtime, P02 boot, and static contracts
        run: npm test
      - name: JavaScript syntax checks
        run: |
          node --check runtime/worldops_event_bus.js
          node --check runtime/worldops_macro_registry.js
          node --check runtime/worldops_widget_registry.js
          node --check runtime/worldops_cache_adapter.js
          node --check runtime/worldops_receipt_store.js
          node --check runtime/worldops_error_boundary.js
          node --check runtime/worldops_module_loader.js
          node --check runtime/worldops_runtime_bridge.js
          node --check runtime/worldops_config_loader.js
          node --check runtime/worldops_capability_registry.js
          node --check runtime/worldops_permission_gate.js
          node --check runtime/worldops_session_handshake.js
          node --check runtime/worldops_snapshot_manager.js
          node --check runtime/worldops_boot_coordinator.js
          node --check tests/p02-boot-lifecycle.mjs
          node --check demo/demo.js
