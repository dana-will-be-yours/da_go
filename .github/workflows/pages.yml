name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Verify Node.js version
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) throw new Error('Node.js 24 is required, current=' + process.version);"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static runtime page
        shell: bash
        run: |
          set -euxo pipefail
          node tools/validate-runtime.js
          node tools/apply-static-runtime.js
          node tools/validate-public-page.js
          node tools/validate-playable-architecture.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4