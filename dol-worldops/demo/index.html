<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DaGo × WorldOps Runtime Foundation</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">CLEAN-ROOM RUNTIME FOUNDATION</p>
      <h1>DaGo × TRPG WorldOps</h1>
      <p>此 Demo 驗證模組依賴、啟動、事件、Macro、Widget、非權威快取與反向停止。</p>
    </header>
    <section class="controls" aria-label="Runtime controls">
      <button id="startButton" type="button">啟動 Runtime</button>
      <button id="eventButton" type="button" disabled>送出測試事件</button>
      <button id="stopButton" type="button" disabled>停止 Runtime</button>
    </section>
    <section class="grid">
      <article><h2>狀態</h2><pre id="statusOutput" aria-live="polite"></pre></article>
      <article><h2>Widget</h2><div id="widgetTarget" class="widget-target"></div></article>
      <article class="wide"><h2>Receipt</h2><pre id="receiptOutput" aria-live="polite"></pre></article>
    </section>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
