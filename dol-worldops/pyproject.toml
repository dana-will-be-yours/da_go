[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "da-go-worldops-server"
version = "0.4.0"
description = "Server-authoritative command, recovery, reconnect, and handoff contract for DaGo TRPG WorldOps"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
]

[tool.setuptools]
package-dir = {"" = "server"}

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
