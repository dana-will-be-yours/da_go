<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DA GO：TRPG Corpus Narrative Game</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">DA GO / TRPG CORPUS</p>
      <h1>互動敘事研究遊戲</h1>
      <p class="subtitle">Passage 引擎、時間推進、事件池、存檔槽、研究紀錄與 SQL Server 語料庫匯出工具</p>
    </div>
    <div class="header-actions">
      <label class="button" for="importFile">
        匯入存檔
        <input id="importFile" type="file" accept="application/json,.json">
      </label>
      <button id="exportSave" type="button">匯出存檔</button>
      <button id="exportCorpus" type="button">匯出 trpg-corpus</button>
      <button id="resetGame" type="button">重置遊戲</button>
    </div>
  </header>

  <nav class="tabs" aria-label="主要頁面">
    <button class="tab" type="button" data-page="game" aria-current="page">遊戲</button>
    <button class="tab" type="button" data-page="character">角色</button>
    <button class="tab" type="button" data-page="world">世界</button>
    <button class="tab" type="button" data-page="log">歷程</button>
    <button class="tab" type="button" data-page="save">存檔</button>
    <button class="tab" type="button" data-page="settings">設定</button>
    <button class="tab" type="button" data-page="corpus">資料庫</button>
  </nav>

  <main>
    <section class="page game-layout" id="page-game">
      <aside class="status-panel panel">
        <div class="panel-head"><h2>狀態側欄</h2></div>
        <div class="panel-body" id="characterStatus"></div>
      </aside>

      <section class="story-panel panel">
        <div class="panel-head">
          <div>
            <h2 id="sceneTitle">場景</h2>
            <p class="muted" id="sceneMeta"></p>
          </div>
          <span class="pill" id="sceneCode"></span>
        </div>
        <div class="panel-body">
          <article class="passage" id="passageText"></article>
          <div class="event-banner" id="eventBanner" hidden></div>
          <div class="choice-list" id="choiceList"></div>
        </div>
      </section>

      <aside class="side-stack">
        <section class="panel">
          <div class="panel-head"><h2>短期記憶</h2></div>
          <div class="panel-body compact-list" id="memoryList"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>物品與線索</h2></div>
          <div class="panel-body compact-list" id="inventoryList"></div>
        </section>
      </aside>
    </section>

    <section class="page" id="page-character" hidden>
      <section class="panel">
        <div class="panel-head"><h2>研究角色卡</h2></div>
        <form class="panel-body form-grid" id="characterForm">
          <label>角色名稱<input name="character_name" type="text" required></label>
          <label>角色代碼<input name="character_code" type="text" required></label>
          <label>角色類型
            <select name="character_type">
              <option value="player_character">玩家角色</option>
              <option value="sub_character">副角色</option>
              <option value="temporary_character">臨時角色</option>
            </select>
          </label>
          <label>原型<input name="archetype" type="text"></label>
          <label>種族/身份<input name="race_or_species" type="text"></label>
          <label>職業/任務<input name="class_or_profession" type="text"></label>
          <label>陣營<input name="faction" type="text"></label>
          <label>敘事功能<input name="narrative_function" type="text"></label>
          <label class="span-2">背景<textarea name="background_story"></textarea></label>
          <label>個性<textarea name="personality_note"></textarea></label>
          <label>動機<textarea name="motivation_note"></textarea></label>
          <label>關係<textarea name="relationship_note"></textarea></label>
          <label>能力<textarea name="ability_note"></textarea></label>
          <label class="span-2">物品<textarea name="item_note"></textarea></label>
          <div class="span-2 form-actions">
            <button class="primary" type="submit">儲存角色卡</button>
          </div>
        </form>
      </section>
    </section>

    <section class="page world-grid" id="page-world" hidden>
      <section class="panel">
        <div class="panel-head"><h2>世界設定</h2></div>
        <div class="panel-body" id="worldSettings"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>規則與查詢</h2></div>
        <div class="panel-body">
          <form class="lookup-form" id="lookupForm">
            <label>查詢目的<input name="purpose" type="text" placeholder="例如：確認角色能否進入禁區"></label>
            <label>查詢文字<textarea name="query" placeholder="輸入玩家或 GM 查詢的內容"></textarea></label>
            <div class="form-actions">
              <button class="primary" type="submit">記錄知識查詢</button>
            </div>
          </form>
          <div class="compact-list" id="lookupList"></div>
        </div>
      </section>
    </section>

    <section class="page" id="page-log" hidden>
      <section class="panel">
        <div class="panel-head">
          <h2>遊戲歷程與研究紀錄</h2>
          <span class="muted" id="logCount"></span>
        </div>
        <div class="timeline" id="eventTimeline"></div>
      </section>
    </section>

    <section class="page" id="page-save" hidden>
      <section class="panel">
        <div class="panel-head"><h2>存檔槽</h2><span class="muted">8 個手動槽 + 自動存檔</span></div>
        <div class="panel-body save-grid" id="saveSlots"></div>
      </section>
    </section>

    <section class="page" id="page-settings" hidden>
      <section class="panel">
        <div class="panel-head"><h2>遊戲與研究設定</h2></div>
        <form class="panel-body form-grid" id="settingsForm">
          <label>顯示模式
            <select name="display_mode">
              <option value="full">完整模式</option>
              <option value="text_only">純文字模式</option>
              <option value="research">研究標註模式</option>
            </select>
          </label>
          <label>側欄指標
            <select name="sidebar_stats">
              <option value="all">全部</option>
              <option value="research">僅 SMM/TMS/追溯</option>
              <option value="minimal">最小</option>
            </select>
          </label>
          <label>連結編號
            <select name="numberify_enabled">
              <option value="true">啟用</option>
              <option value="false">停用</option>
            </select>
          </label>
          <label>自動存檔
            <select name="autosave_enabled">
              <option value="true">啟用</option>
              <option value="false">停用</option>
            </select>
          </label>
          <label class="span-2">研究備註<textarea name="research_note"></textarea></label>
          <div class="span-2 form-actions">
            <button class="primary" type="submit">儲存設定</button>
          </div>
        </form>
      </section>
    </section>

    <section class="page corpus-grid" id="page-corpus" hidden>
      <section class="panel">
        <div class="panel-head"><h2>trpg-corpus 連結設定</h2></div>
        <form class="panel-body form-grid" id="corpusForm">
          <label>project_code<input name="project_code" type="text"></label>
          <label>team_code<input name="team_code" type="text"></label>
          <label>session_code<input name="session_code" type="text"></label>
          <label>import_batch_code<input name="import_batch_code" type="text"></label>
          <label class="span-2">API endpoint（選用；靜態頁面預設只匯出 JSON）<input name="api_endpoint" type="url" placeholder="https://your-api.example.com/trpg-corpus/import"></label>
          <div class="span-2 form-actions">
            <button class="primary" type="submit">儲存連結設定</button>
            <button id="copyCorpusJson" type="button">複製 corpus JSON</button>
          </div>
        </form>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>資料庫對應摘要</h2></div>
        <div class="panel-body mapping-table" id="mappingTable"></div>
      </section>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
