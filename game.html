<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大國年代記</title>
  <link rel="stylesheet" href="assets/game-screen.css">
</head>
<body data-text-style="standard">
  <div id="story" role="main">
    <div id="passages" aria-live="polite">
      <article id="passage" class="passage">
        <section id="startPanel" class="start-panel">
          <h1>大國年代記</h1>
          <p class="version">文字沙盒測試版</p>
          <form id="startForm" class="start-form">
            <label>角色名字
              <input id="playerName" name="playerName" type="text" value="旅人" maxlength="16" autocomplete="off">
            </label>
            <fieldset>
              <legend>身體</legend>
              <div class="field-group"><span>性別</span><label><input type="radio" name="gender" value="female" checked> 女</label><label><input type="radio" name="gender" value="male"> 男</label><label><input type="radio" name="gender" value="undisclosed"> 未定</label></div>
              <div class="field-group"><span>高矮</span><label><input type="radio" name="height" value="short"> 矮</label><label><input type="radio" name="height" value="average" checked> 中等</label><label><input type="radio" name="height" value="tall"> 高</label></div>
              <div class="field-group"><span>胖瘦體型</span><label><input type="radio" name="build" value="slender"> 纖瘦</label><label><input type="radio" name="build" value="balanced" checked> 勻稱</label><label><input type="radio" name="build" value="strong"> 健壯</label><label><input type="radio" name="build" value="soft"> 豐潤</label></div>
              <div class="field-group"><span>身體線條</span><label><input type="radio" name="bodyLine" value="straight" checked> 直線</label><label><input type="radio" name="bodyLine" value="soft_curve"> 柔和</label><label><input type="radio" name="bodyLine" value="firm"> 結實</label></div>
              <div class="field-group"><span>膚色</span><label><input type="radio" name="skinTone" value="pale" checked> 白皙</label><label><input type="radio" name="skinTone" value="wheat"> 小麥</label><label><input type="radio" name="skinTone" value="bronze"> 古銅</label><label><input type="radio" name="skinTone" value="deep"> 深褐</label></div>
            </fieldset>
            <fieldset>
              <legend>頭部</legend>
              <div class="field-group"><span>面容儀態</span><label><input type="radio" name="face" value="clear" checked> 清秀</label><label><input type="radio" name="face" value="upright"> 端正</label><label><input type="radio" name="face" value="sharp"> 銳利</label><label><input type="radio" name="face" value="gentle"> 溫雅</label></div>
              <div class="field-group"><span>瞳色</span><label><input type="radio" name="eyeColor" value="black" checked> 黑瞳</label><label><input type="radio" name="eyeColor" value="brown"> 褐瞳</label><label><input type="radio" name="eyeColor" value="amber"> 琥珀瞳</label><label><input type="radio" name="eyeColor" value="gray"> 灰瞳</label></div>
              <div class="field-group"><span>髮色</span><label><input type="radio" name="hairColor" value="black" checked> 黑髮</label><label><input type="radio" name="hairColor" value="dark_brown"> 深褐髮</label><label><input type="radio" name="hairColor" value="tea"> 茶褐髮</label><label><input type="radio" name="hairColor" value="silver"> 銀灰髮</label></div>
              <div class="field-group"><span>頭髮長度</span><label><input type="radio" name="hairLength" value="short" checked> 短髮</label><label><input type="radio" name="hairLength" value="shoulder"> 及肩</label><label><input type="radio" name="hairLength" value="long"> 長髮</label><label><input type="radio" name="hairLength" value="bound"> 束髮</label></div>
            </fieldset>
            <fieldset>
              <legend>性格與背景</legend>
              <div class="field-group"><span>身分</span><label><input type="radio" name="role" value="wenxuan"> 文選</label><label><input type="radio" name="role" value="house_son"> 門閥子弟</label><label><input type="radio" name="role" value="yamen" checked> 胥吏</label><label><input type="radio" name="role" value="guard"> 衛士</label><label><input type="radio" name="role" value="wanderer"> 遊俠</label><label><input type="radio" name="role" value="merchant"> 行商</label><label><input type="radio" name="role" value="medic"> 坊郭醫</label><label><input type="radio" name="role" value="artist"> 伎伶俳優</label><label><input type="radio" name="role" value="disciple"> 門派弟子</label></div>
              <div class="field-group"><span>出身地</span><label><input type="radio" name="origin" value="nanjing" checked> 南京</label><label><input type="radio" name="origin" value="jiang"> 江郡</label><label><input type="radio" name="origin" value="nanyang"> 南陽</label><label><input type="radio" name="origin" value="yinchuan"> 銀川</label><label><input type="radio" name="origin" value="kunlun"> 崑崙</label><label><input type="radio" name="origin" value="wudu"> 洞庭五毒</label><label><input type="radio" name="origin" value="huayin"> 華陰山</label></div>
              <div class="field-group"><span>性格</span><label><input type="radio" name="trait" value="calm" checked> 冷靜</label><label><input type="radio" name="trait" value="streetwise"> 熟路</label><label><input type="radio" name="trait" value="silver_tongue"> 善談</label><label><input type="radio" name="trait" value="sturdy"> 耐勞</label><label><input type="radio" name="trait" value="upright"> 雅正</label><label><input type="radio" name="trait" value="reckless"> 急烈</label></div>
              <div class="field-group"><span>身分品級</span><label><input type="radio" name="rank" value="wu" checked> 戊</label><label><input type="radio" name="rank" value="ding"> 丁</label><label><input type="radio" name="rank" value="bing"> 丙</label><label><input type="radio" name="rank" value="yi"> 乙</label><label><input type="radio" name="rank" value="jia"> 甲</label></div>
              <div class="field-group"><span>屬性點配置</span><label><input type="radio" name="attributePlan" value="balanced" checked> 均衡</label><label><input type="radio" name="attributePlan" value="body"> 體魄</label><label><input type="radio" name="attributePlan" value="tech"> 技巧</label><label><input type="radio" name="attributePlan" value="mind"> 智識</label><label><input type="radio" name="attributePlan" value="social"> 交際</label><label><input type="radio" name="attributePlan" value="travel"> 行路</label></div>
              <div class="field-group"><span>特殊身世</span><label><input type="radio" name="specialOrigin" value="none" checked> 無</label><label><input type="radio" name="specialOrigin" value="taihu_wei"> 太湖魏家旁支</label><label><input type="radio" name="specialOrigin" value="jinling_yang"> 金陵陽家旁支</label><label><input type="radio" name="specialOrigin" value="shangqiu_gongsun"> 商丘公孫家遠支</label><label><input type="radio" name="specialOrigin" value="cangbei_bei"> 滄北北家舊識</label><label><input type="radio" name="specialOrigin" value="qishan_ye"> 岐山葉氏門生</label><label><input type="radio" name="specialOrigin" value="kunlun_chu"> 蓬萊崑崙外系</label><label><input type="radio" name="specialOrigin" value="dongting_wudu"> 洞庭五毒外緣</label><label><input type="radio" name="specialOrigin" value="jiuqu_huayin"> 九曲華陰耳目</label><label><input type="radio" name="specialOrigin" value="donglai_xuanhai"> 東萊玄海舊友</label><label><input type="radio" name="specialOrigin" value="jiannan_yuezong"> 劍南越宗道緣</label><label><input type="radio" name="specialOrigin" value="nanjiang_xiaoyao"> 南境逍遙故人</label><label><input type="radio" name="specialOrigin" value="wanminhui"> 萬民會暗語</label></div>
            </fieldset>
            <fieldset>
              <legend>遊戲設置</legend>
              <div class="field-group"><span>起始時節</span><label><input type="radio" name="startSeason" value="spring"> 春（三月三日）</label><label><input type="radio" name="startSeason" value="summer"> 夏（六月六日）</label><label><input type="radio" name="startSeason" value="autumn" checked> 秋（九月九日）</label><label><input type="radio" name="startSeason" value="winter"> 冬（十二月十二日）</label></div>
              <div class="field-group"><span>遊戲模式</span><label><input type="radio" name="gameMode" value="story"> 劇情</label><label><input type="radio" name="gameMode" value="standard" checked> 標準</label><label><input type="radio" name="gameMode" value="survival"> 生存</label></div>
              <div class="field-group"><span>難度</span><label><input type="radio" name="difficulty" value="relaxed"> 寬鬆</label><label><input type="radio" name="difficulty" value="standard" checked> 標準</label><label><input type="radio" name="difficulty" value="pressure"> 壓力</label></div>
              <div class="field-group"><span>檢定</span><label><input type="checkbox" name="showCheckRate" checked> 顯示技能檢定成功率</label></div>
            </fieldset>
            <fieldset>
              <legend>文字外觀</legend>
              <label><input type="radio" name="textStyle" value="standard" checked> 標準</label>
              <label><input type="radio" name="textStyle" value="scroll"> 書卷</label>
              <label><input type="radio" name="textStyle" value="night"> 夜讀</label>
              <label><input type="radio" name="textStyle" value="large"> 大字</label>
            </fieldset>
            <div class="start-actions">
              <button id="randomizeCharacter" type="button">隨機化</button>
              <button id="startButton" type="submit">開始遊戲</button>
            </div>
          </form>
        </section>

        <section id="playPanel" hidden>
          <header class="passage-header">
            <h2 id="passageTitle"></h2>
            <p id="passageMeta"></p>
          </header>
          <section id="passageText" class="passage-text"></section>
          <nav id="choiceList" class="choice-list"></nav>
          <footer id="passageFooter"></footer>
        </section>
      </article>
    </div>
  </div>

  <aside id="ui-bar" aria-live="polite">
    <div id="ui-bar-body">
      <header id="title" role="banner">
        <div id="story-banner"></div>
        <h1 id="story-title">大國年代記</h1>
        <div id="story-subtitle">文字沙盒</div>
      </header>

      <nav id="ui-actions">
        <button type="button" class="panel-wide" data-action="panel" data-panel="attributes">屬性</button>
        <button type="button" class="panel-wide" data-action="panel" data-panel="social">社交</button>
        <button type="button" data-action="panel" data-panel="traits">特質</button>
        <button type="button" data-action="panel" data-panel="journal">日誌</button>
        <button type="button" data-action="panel" data-panel="stats">統計</button>
        <button type="button" data-action="panel" data-panel="achievements">地圖</button>
        <button type="button" data-action="panel" data-panel="options">選項</button>
        <button type="button" data-action="panel" data-panel="saves">存檔</button>
        <button type="button" class="panel-wide" data-action="panel" data-panel="researcher">研究者</button>
      </nav>

      <section class="sidebar-block">
        <h2>概覽</h2>
        <div id="overviewBox" class="sidebar-list"></div>
      </section>
    </div>
  </aside>

  <div id="overlayBackdrop" class="overlay-backdrop hidden">
    <section id="overlay" class="overlay">
      <header class="overlay-head">
        <h2 id="overlayTitle"></h2>
        <button type="button" id="closeOverlay">關閉</button>
      </header>
      <div id="overlayContent" class="overlay-content"></div>
    </section>
  </div>

  <script src="assets/game-runtime.js?v=1.7.0-seasonal-authoring-v4"></script>
</body>
</html>
