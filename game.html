<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大國年代記</title>
  <link rel="stylesheet" href="assets/game-screen.css">
</head>
<body data-text-style="standard">
  <div id="story" role="main">
    <div id="passages" aria-live="polite">
      <article id="passage" class="passage">
        <section id="startPanel" class="start-panel">
          <h1>大國年代記</h1>
          <p class="version">TRPG corpus playable sandbox</p>
          <form id="startForm" class="start-form">
            <label>角色名字
              <input id="playerName" name="playerName" type="text" value="旅人" maxlength="16" autocomplete="off">
            </label>
            <fieldset>
              <legend>角色職能</legend>
              <label><input type="radio" name="role" value="scribe" checked> 書吏線人</label>
              <label><input type="radio" name="role" value="wanderer"> 江湖遊士</label>
              <label><input type="radio" name="role" value="merchant"> 商旅耳目</label>
              <label><input type="radio" name="role" value="medic"> 醫館學徒</label>
            </fieldset>
            <fieldset>
              <legend>出身</legend>
              <label><input type="radio" name="origin" value="nanjing" checked> 南京</label>
              <label><input type="radio" name="origin" value="north"> 北路</label>
              <label><input type="radio" name="origin" value="south"> 南市</label>
              <label><input type="radio" name="origin" value="wudu"> 五毒</label>
            </fieldset>
            <fieldset>
              <legend>特質</legend>
              <label><input type="radio" name="trait" value="calm" checked> 冷靜</label>
              <label><input type="radio" name="trait" value="streetwise"> 熟路</label>
              <label><input type="radio" name="trait" value="silver_tongue"> 善談</label>
              <label><input type="radio" name="trait" value="sturdy"> 耐勞</label>
            </fieldset>
            <fieldset>
              <legend>難度</legend>
              <label><input type="radio" name="difficulty" value="relaxed"> 寬鬆</label>
              <label><input type="radio" name="difficulty" value="standard" checked> 標準</label>
              <label><input type="radio" name="difficulty" value="pressure"> 壓力</label>
            </fieldset>
            <fieldset>
              <legend>文字外觀</legend>
              <label><input type="radio" name="textStyle" value="standard" checked> 標準</label>
              <label><input type="radio" name="textStyle" value="scroll"> 書卷</label>
              <label><input type="radio" name="textStyle" value="night"> 夜讀</label>
              <label><input type="radio" name="textStyle" value="large"> 大字</label>
            </fieldset>
            <button id="startButton" type="submit">開始遊戲</button>
          </form>
        </section>

        <section id="playPanel" hidden>
          <header class="passage-header">
            <h2 id="passageTitle"></h2>
            <p id="passageMeta"></p>
          </header>
          <section id="passageText" class="passage-text"></section>
          <nav id="choiceList" class="choice-list"></nav>
          <footer id="passageFooter"></footer>
        </section>
      </article>
    </div>
  </div>

  <aside id="ui-bar" aria-live="polite">
    <div id="ui-bar-body">
      <header id="title" role="banner">
        <div id="story-banner"></div>
        <h1 id="story-title">大國年代記</h1>
        <div id="story-subtitle">TRPG Corpus Sandbox</div>
      </header>

      <nav id="ui-actions">
        <button type="button" class="panel-wide" data-action="panel" data-panel="attributes">屬性</button>
        <button type="button" class="panel-wide" data-action="panel" data-panel="social">社交</button>
        <button type="button" data-action="panel" data-panel="traits">特質</button>
        <button type="button" data-action="panel" data-panel="journal">日誌</button>
        <button type="button" data-action="panel" data-panel="stats">統計</button>
        <button type="button" data-action="panel" data-panel="achievements">成就</button>
        <button type="button" data-action="panel" data-panel="options">選項</button>
        <button type="button" data-action="panel" data-panel="saves">存檔</button>
        <button type="button" class="panel-wide" data-action="panel" data-panel="researcher">研究者</button>
      </nav>

      <section class="sidebar-block">
        <h2>概覽</h2>
        <div id="overviewBox" class="sidebar-list"></div>
      </section>
    </div>
  </aside>

  <div id="overlayBackdrop" class="overlay-backdrop hidden">
    <section id="overlay" class="overlay">
      <header class="overlay-head">
        <h2 id="overlayTitle"></h2>
        <button type="button" id="closeOverlay">關閉</button>
      </header>
      <div id="overlayContent" class="overlay-content"></div>
    </section>
  </div>

  <script src="assets/game-runtime.js"></script>
</body>
</html>
