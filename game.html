<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大國年代記</title>
  <link rel="stylesheet" href="assets/game-screen.css">
  <link rel="stylesheet" href="assets/game-v4.css">
</head>
<body data-text-style="standard">
  <div id="story" role="main">
    <div id="passages" aria-live="polite">
      <article id="passage" class="passage">
        <section id="startPanel" class="start-panel">
          <h1>大國年代記</h1>
          <p class="version">小城舊事</p>
          <form id="startForm" class="start-form">
            <label>角色名字
              <input id="playerName" name="playerName" type="text" value="旅人" maxlength="16" autocomplete="off">
            </label>
            <fieldset>
              <legend>身體</legend>
              <div class="field-group"><span>性別</span><label><input type="radio" name="gender" value="female" checked> 女</label><label><input type="radio" name="gender" value="male"> 男</label><label><input type="radio" name="gender" value="undisclosed"> 未定</label></div>
            </fieldset>
            <fieldset>
              <legend>身分五選</legend>
              <p class="field-help">選五個身分。此版本先恢復公開頁進入遊戲。</p>
              <div class="role-stack-grid">
                <label>第一身分<select name="roles"><option value="yamen" selected>胥吏</option><option value="wanderer">遊俠</option><option value="merchant">行商</option></select></label>
                <label>第二身分<select name="roles"><option value="wanderer" selected>遊俠</option><option value="yamen">胥吏</option><option value="merchant">行商</option></select></label>
                <label>第三身分<select name="roles"><option value="merchant" selected>行商</option><option value="yamen">胥吏</option><option value="wanderer">遊俠</option></select></label>
              </div>
            </fieldset>
            <fieldset>
              <legend>性格與背景</legend>
              <div class="field-group"><span>出身地</span><label><input type="radio" name="origin" value="changshan" checked> 常山縣本地</label><label><input type="radio" name="origin" value="tianjin"> 天津郡郡城</label></div>
              <div class="field-group"><span>性格</span><label><input type="radio" name="trait" value="calm" checked> 冷靜</label><label><input type="radio" name="trait" value="streetwise"> 熟路</label></div>
            </fieldset>
            <div class="start-actions">
              <button id="randomizeCharacter" type="button">隨機化</button>
              <button id="startButton" type="submit">開始遊戲</button>
            </div>
          </form>
        </section>
        <section id="playPanel" hidden>
          <header class="passage-header"><h2 id="passageTitle"></h2><p id="passageMeta"></p></header>
          <section id="passageText" class="passage-text"></section><nav id="choiceList" class="choice-list"></nav><footer id="passageFooter"></footer>
        </section>
      </article>
    </div>
  </div>
  <aside id="ui-bar" aria-live="polite"><div id="ui-bar-body"><header id="title" role="banner"><div id="story-banner"></div><h1 id="story-title">大國年代記</h1><div id="story-subtitle">天津郡常山縣</div></header><nav id="ui-actions"><button type="button" data-action="panel" data-panel="stats">統計</button><button type="button" data-action="panel" data-panel="journal">日誌</button><button type="button" data-action="panel" data-panel="saves">存檔</button></nav><section class="sidebar-block"><h2>概覽</h2><div id="overviewBox" class="sidebar-list"></div></section></div></aside>
  <div id="overlayBackdrop" class="overlay-backdrop hidden"><section id="overlay" class="overlay"><header class="overlay-head"><h2 id="overlayTitle"></h2><button type="button" id="closeOverlay">關閉</button></header><div id="overlayContent" class="overlay-content"></div></section></div>
  <script src="assets/game-runtime.js?v=1.12.2-csp-boot"></script>
</body>
</html>
